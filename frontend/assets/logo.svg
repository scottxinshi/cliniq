    <path d="M 88 136 C 76 144 66 150 58 158" stroke-width="2.8"/>
    <path d="M 92 138 C 84 148 78 155 74 162" stroke-width="2.5"/>

    <!-- Wing: large outer arc sweeping up-left -->
    <path d="M 112 95 C 100 78 78 58 54 50 C 40 46 34 58 42 72 C 50 86 72 94 92 100" stroke-width="3.8"/>
    <!-- Feather lines 1 -->
    <path d="M 110 98 C 98 82 78 64 56 58 C 44 54 38 65 46 78 C 54 90 74 97 92 101" stroke-width="2.8"/>
    <!-- Feather lines 2 -->
    <path d="M 108 101 C 97 87 80 72 62 67 C 51 64 46 74 53 85 C 60 96 78 101 92 103" stroke-width="2.4"/>
    <!-- Feather lines 3 -->
    <path d="M 106 104 C 96 92 82 80 66 76 C 57 73 53 82 59 92 C 65 101 82 105 92 105" stroke-width="2"/>

  </g>
</svg>