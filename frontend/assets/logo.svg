<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="96" fill="white" stroke="#e0e0e0" stroke-width="0.5"/>
  <g fill="none" stroke="#1a7d7d" stroke-linecap="round" stroke-linejoin="round">

    <!-- Beak -->
    <path d="M 126 87 L 162 76" stroke-width="3.5"/>

    <!-- Head -->
    <circle cx="120" cy="91" r="8" stroke-width="3.5" fill="white"/>
    <circle cx="123" cy="89" r="2.5" fill="#1a7d7d" stroke="none"/>

    <!-- Body: smooth teardrop from neck down to tail base -->
